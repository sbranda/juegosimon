<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorión</title>
<meta name="description" content="Juego de memoria de secuencias de colores. Elegí entre seis diseños.">
<meta name="theme-color" content="#12141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memorión">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Work+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0}
  :root{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme: dark;
    --m-bg:#12141c; --m-bg2:#1b1e29; --m-card:#1e2230; --m-card-edge:#2c3247;
    --m-ink:#eef0f7; --m-muted:#8d93ad;
    --m-accent:#6d8bff;
  }
  [hidden]{display:none!important}
  .pad,.petal{
    -webkit-tap-highlight-color:transparent;tap-highlight-color:transparent;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  body{
    background:radial-gradient(120% 70% at 50% 0%, var(--m-bg2), var(--m-bg) 70%);
    background-color:var(--m-bg);
    color:var(--m-ink);
    font-family:"Manrope", system-ui, sans-serif;
  }

  /* ---------- Menú ---------- */
  #menu{display:flex;justify-content:center;padding-inline:16px}
  .menu-wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px;padding-block:26px 32px}
  .menu-head h1{font-size:clamp(26px,7vw,32px);margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
  .menu-head p{margin:0;color:var(--m-muted);font-size:14px}

  .cards{display:flex;flex-direction:column;gap:12px}
  .card{
    display:flex;gap:14px;align-items:center;text-align:left;
    background:var(--m-card);border:1px solid var(--m-card-edge);border-radius:16px;
    padding:12px;appearance:none;cursor:pointer;color:inherit;font-family:inherit;
    transition:border-color .12s, transform .08s;
  }
  .card:hover{border-color:var(--m-accent)}
  .card:active{transform:scale(.99)}
  .card:focus-visible{outline:2px solid var(--m-accent);outline-offset:2px}

  .prev{width:60px;height:60px;flex:0 0 auto;border-radius:12px;position:relative;overflow:hidden}
  .prev span{position:absolute;display:block}

  .prev-neon{background:#070312;border:1px solid #2a1552}
  .prev-neon span{width:24px;height:24px;border-radius:5px;background:#0a0616}
  .prev-neon span:nth-child(1){top:6px;left:6px;border:2px solid #12ffb0;box-shadow:0 0 6px #12ffb0}
  .prev-neon span:nth-child(2){top:6px;right:6px;border:2px solid #ff2b8f;box-shadow:0 0 6px #ff2b8f}
  .prev-neon span:nth-child(3){bottom:6px;left:6px;border:2px solid #ffe814;box-shadow:0 0 6px #ffe814}
  .prev-neon span:nth-child(4){bottom:6px;right:6px;border:2px solid #26d3ff;box-shadow:0 0 6px #26d3ff}

  .prev-consola{background:#f1e6cc}
  .prev-consola span{width:12px;height:12px;top:50%;margin-top:-6px;border-radius:50%;box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .prev-consola span:nth-child(1){left:5px;background:#2f9e58}
  .prev-consola span:nth-child(2){left:20px;background:#d6402f}
  .prev-consola span:nth-child(3){left:35px;background:#e8ab1c}
  .prev-consola span:nth-child(4){left:50px;background:#2b6fc9}

  .prev-flat{background:#faf8f4;border:1px solid #e7e2d8}
  .prev-flat span{width:22px;height:22px;border-radius:6px}
  .prev-flat span:nth-child(1){top:7px;left:7px;background:#e94f37}
  .prev-flat span:nth-child(2){top:7px;right:7px;background:#0f9d8f}
  .prev-flat span:nth-child(3){bottom:7px;left:7px;background:#f2a900}
  .prev-flat span:nth-child(4){bottom:7px;right:7px;background:#4a4de7}

  .prev-botanico{background:#f3ecdd}
  .prev-botanico span{width:30px;height:30px}
  .prev-botanico span:nth-child(1){top:0;left:0;background:#4f7942;border-radius:0 100% 100% 100%}
  .prev-botanico span:nth-child(2){top:0;right:0;background:#c1652f;border-radius:100% 0 100% 100%}
  .prev-botanico span:nth-child(3){bottom:0;left:0;background:#d7a233;border-radius:100% 100% 100% 0}
  .prev-botanico span:nth-child(4){bottom:0;right:0;background:#7c3a56;border-radius:100% 100% 0 100%}

  .prev-terminal{background:#050705;background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.4) 0 1px, transparent 1px 3px)}
  .prev-terminal span{width:22px;height:22px;border:1px solid currentColor;border-radius:2px}
  .prev-terminal span:nth-child(1){top:7px;left:7px;color:#33ff66}
  .prev-terminal span:nth-child(2){top:7px;right:7px;color:#ffcf33}
  .prev-terminal span:nth-child(3){bottom:7px;left:7px;color:#33e0ff}
  .prev-terminal span:nth-child(4){bottom:7px;right:7px;color:#ff5fd6}

  .prev-pizarron{background:linear-gradient(155deg,#2c3d33,#233129);border:4px solid #6b4a30}
  .prev-pizarron span{width:22px;height:22px;border:2px dashed currentColor;background:transparent}
  .prev-pizarron span:nth-child(1){top:5px;left:5px;color:#8ee7b3;border-radius:30px 4px 26px 4px}
  .prev-pizarron span:nth-child(2){top:5px;right:5px;color:#ff8a75;border-radius:4px 26px 4px 30px}
  .prev-pizarron span:nth-child(3){bottom:5px;left:5px;color:#ffd166;border-radius:26px 4px 30px 4px}
  .prev-pizarron span:nth-child(4){bottom:5px;right:5px;color:#8ec9ff;border-radius:4px 30px 4px 26px}

  .card-body{flex:1;min-width:0}
  .card-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-title{font-weight:800;font-size:15px}
  .badge{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--m-accent);
    background:rgba(109,139,255,.14);border-radius:999px;padding:2px 8px;font-weight:700}
  .card-tag{margin:3px 0 0;color:var(--m-muted);font-size:12.5px;line-height:1.4}
  .card-rec{margin-top:5px;font-size:11px;color:var(--m-muted);font-variant-numeric:tabular-nums}
  .card-rec b{color:var(--m-ink)}
  .chev{flex:0 0 auto;color:var(--m-muted);font-size:20px}

  footer.credit{font-size:12px;color:var(--m-muted);text-align:center}

  /* ---------- Stage + back bar ---------- */
  #backbar{
    position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:10px 14px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:rgba(8,8,12,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#f2f2f7;font-family:"Manrope",system-ui,sans-serif;
  }
  .back-btn{appearance:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;
    font:700 13px "Manrope",sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
  .back-btn:active{background:rgba(255,255,255,.18)}
  .back-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  #backbar-name{font-size:12px;color:rgba(255,255,255,.75);font-weight:600;letter-spacing:.02em}
  #stage{padding-top:44px}

  @media (min-width:600px){
    .cards{display:grid;grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<div id="backbar" hidden>
  <button class="back-btn" id="backBtn" type="button">‹ Diseños</button>
  <span id="backbar-name"></span>
</div>

<div id="menu">
  <div class="menu-wrap">
    <div class="menu-head">
      <h1>Memorión</h1>
      <p>Elegí un diseño y repetí la secuencia de colores</p>
    </div>

    <div class="cards" id="cardList">
      <button class="card" data-skin="neon" type="button">
        <div class="prev prev-neon"><span></span><span></span><span></span><span></span></div>
        <div class="card-body">
          <div class="card-title-row"><span class="card-title">Neón Cuadrante</span><span class="badge" data-lastbadge="neon" hidden>Último</span></div>
          <p class="card-tag">Arcade synthwave con luces de neón</p>
          <p class="card-rec" data-rec="neon"></p>
        </div>
        <span class="chev" aria-hidden="true">›</span>
      </button>

      <button class="card" data-skin="consola" type="button">
        <div class="prev prev-consola"><span></span><span></span><span></span><span></span></div>
        <div class="card-body">
          <div class="card-title-row"><span class="card-title">Botonera Eco</span><span class="badge" data-lastbadge="consola" hidden>Último</span></div>
          <p class="card-tag">Consola de juguete plástica clásica</p>
          <p class="card-rec" data-rec="consola"></p>
        </div>
        <span class="chev" aria-hidden="true">›</span>
      </button>

      <button class="card" data-skin="flat" type="button">
        <div class="prev prev-flat"><span></span><span></span><span></span><span></span></div>
        <div class="card-body">
          <div class="card-title-row"><span class="card-title">Secuencia Cuatro</span><span class="badge" data-lastbadge="flat" hidden>Último</span></div>
          <p class="card-tag">Minimalista, plana y luminosa</p>
          <p class="card-rec" data-rec="flat"></p>
        </div>
        <span class="chev" aria-hidden="true">›</span>
      </button>

      <button class="card" data-skin="botanico" type="button">
        <div class="prev prev-botanico"><span></span><span></span><span></span><span></span></div>
        <div class="card-body">
          <div class="card-title-row"><span class="card-title">Ronda Silvestre</span><span class="badge" data-lastbadge="botanico" hidden>Último</span></div>
          <p class="card-tag">Pétalos y tonos tierra de jardín</p>
          <p class="card-rec" data-rec="botanico"></p>
        </div>
        <span class="chev" aria-hidden="true">›</span>
      </button>

      <button class="card" data-skin="terminal" type="button">
        <div class="prev prev-terminal"><span></span><span></span><span></span><span></span></div>
        <div class="card-body">
          <div class="card-title-row"><span class="card-title">Terminal Mnemo</span><span class="badge" data-lastbadge="terminal" hidden>Último</span></div>
          <p class="card-tag">Consola CRT verde fósforo</p>
          <p class="card-rec" data-rec="terminal"></p>
        </div>
        <span class="chev" aria-hidden="true">›</span>
      </button>

      <button class="card" data-skin="pizarron" type="button">
        <div class="prev prev-pizarron"><span></span><span></span><span></span><span></span></div>
        <div class="card-body">
          <div class="card-title-row"><span class="card-title">Pizarrón Vivo</span><span class="badge" data-lastbadge="pizarron" hidden>Último</span></div>
          <p class="card-tag">Tiza de colores sobre pizarrón de madera</p>
          <p class="card-rec" data-rec="pizarron"></p>
        </div>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    </div>

    <footer class="credit">Desarrollado por Seba Branda</footer>
  </div>
</div>

<div id="stage" hidden></div>

<script>
const SKINS = {
  neon: {
    name: "Ne\u00f3n Cuadrante",
    tag: "Arcade synthwave con luces de ne\u00f3n",
    bestKey: "neon-cuadrante-best",
    css: `
  :root{
    color-scheme: dark;
    --bg:#070312; --bg2:#120826; --grid:#1c0f3a;
    --panel:#0d0620; --panel-edge:#2a1552;
    --ink:#f3eeff; --muted:#8b7fc4;
    --c0:#12ffb0; --c0-hi:#9dffe0;  /* verde */
    --c1:#ff2b8f; --c1-hi:#ffa9d4;  /* magenta */
    --c2:#ffe814; --c2-hi:#fff9a8;  /* amarillo */
    --c3:#26d3ff; --c3-hi:#b3f0ff;  /* cian */
    --c4:#ff8a1e; --c4-hi:#ffd0a3;  /* naranja */
    --c5:#9b6bff; --c5-hi:#d8c8ff;  /* violeta */
    --c6:#ff4d6d; --c6-hi:#ffb3c1;  /* rojo rosado */
    --c7:#4dffb8; --c7-hi:#bafff0;  /* verde agua */
    --lcd:#04140f; --lcd-ink:#12ffb0;
  }
  html,body{height:100%}
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg2), transparent 60%),
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 42px),
      var(--bg);
    background-color:var(--bg);
    color:var(--ink);
    font-family:"Share Tech Mono", ui-monospace, monospace;
    display:flex;justify-content:center;
    padding-inline:16px;
  }
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  [hidden]{display:none!important}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:26px 30px}

  header{text-align:center}
  h1{font-family:"Press Start 2P", monospace;font-weight:400;font-size:clamp(20px,6.5vw,28px);margin:0;letter-spacing:.03em;line-height:1.4;
     color:var(--c3);text-shadow:0 0 6px var(--c3), 0 0 22px var(--c3-hi);}
  .tag{margin:10px 0 0;color:var(--muted);font-size:13px;letter-spacing:.06em}

  .device{position:relative;width:100%;max-width:380px;aspect-ratio:1;
    background:linear-gradient(160deg,var(--panel-edge),var(--panel) 60%);
    border-radius:20px;padding:14px;
    border:1px solid var(--panel-edge);
    box-shadow:0 0 0 1px rgba(255,255,255,.03), 0 25px 60px rgba(0,0,0,.7), inset 0 0 40px rgba(0,0,0,.5)}
  .device[data-level="4"]{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
  .device[data-level="4"] .gridpads{display:contents}
  .device:not([data-level="4"]){display:flex;flex-direction:column;gap:12px}
  .device:not([data-level="4"]) .gridpads{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;flex:1}
  .device:not([data-level="4"]) .hub{position:static;transform:none;width:auto;flex-direction:row;gap:10px;padding:8px 14px;order:-1;aspect-ratio:auto}
  .pad{appearance:none;border:0;cursor:pointer;position:relative;border-radius:10px;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    background:#0a0616;
    border:2px solid var(--pc);
    color:var(--pc);
    transition:background .08s, box-shadow .08s, transform .08s;
    box-shadow:inset 0 0 18px color-mix(in srgb, var(--pc) 25%, transparent)}
  .pad[data-i="0"]{--pc:var(--c0)}
  .pad[data-i="1"]{--pc:var(--c1)}
  .pad[data-i="2"]{--pc:var(--c2)}
  .pad[data-i="3"]{--pc:var(--c3)}
  .pad[data-i="4"]{--pc:var(--c4)}
  .pad[data-i="5"]{--pc:var(--c5)}
  .pad[data-i="6"]{--pc:var(--c6)}
  .pad[data-i="7"]{--pc:var(--c7)}
  .pad .key{position:absolute;top:10px;left:12px;font-family:"Press Start 2P",monospace;font-size:10px;letter-spacing:.05em;opacity:.7}
  .pad.lit{background:var(--pc);color:#050109;transform:scale(.98);
    box-shadow:0 0 30px var(--pc), 0 0 70px var(--pc), inset 0 0 25px rgba(255,255,255,.5)}
  .pad:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .locked .pad{cursor:default}

  .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:34%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #1a0f38, #08041a 70%);
    border:2px solid var(--panel-edge);
    box-shadow:0 0 24px rgba(0,0,0,.6);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none}
  .lcd{background:var(--lcd);color:var(--lcd-ink);font-family:"Share Tech Mono",monospace;font-weight:700;
    font-variant-numeric:tabular-nums;font-size:clamp(20px,6vw,26px);line-height:1;padding:5px 10px;border-radius:4px;
    min-width:2.6ch;text-align:center;text-shadow:0 0 10px currentColor;box-shadow:inset 0 0 10px rgba(0,0,0,.6)}
  .lcd.bad{color:#ff5566;text-shadow:0 0 10px #ff5566}
  .hub small{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

  .status{min-height:1.4em;font-size:14px;text-align:center;color:var(--ink)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
  .btn{appearance:none;border:1px solid var(--c1);cursor:pointer;font:700 13px "Share Tech Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
    padding:12px 20px;border-radius:6px;background:transparent;color:var(--c1);
    box-shadow:0 0 14px color-mix(in srgb, var(--c1) 35%, transparent)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.seg button:focus-visible,.toggle input:focus-visible+span{outline:2px solid var(--c3-hi);outline-offset:2px}
  .seg{display:inline-flex;background:#0a0616;border:1px solid var(--panel-edge);border-radius:6px;padding:3px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 12px "Share Tech Mono",monospace;padding:9px 11px;border-radius:4px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--panel-edge);color:var(--c3)}
  .toggle{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
  .toggle input{position:absolute;opacity:0;width:1px;height:1px}
  .toggle span{width:36px;height:20px;border-radius:4px;background:#0a0616;border:1px solid var(--panel-edge);position:relative;transition:background .15s}
  .toggle span::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:2px;background:var(--muted);transition:transform .15s, background .15s}
  .toggle input:checked+span{border-color:var(--c1)}
  .toggle input:checked+span::after{transform:translateX(16px);background:var(--c1);box-shadow:0 0 8px var(--c1)}

  .stats{display:flex;gap:26px;justify-content:center;font-variant-numeric:tabular-nums}
  .stat{text-align:center}
  .stat b{display:block;font-size:20px;color:var(--c2);text-shadow:0 0 8px color-mix(in srgb, var(--c2) 50%, transparent)}
  .stat span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  details{width:100%;color:var(--muted);font-size:13px;line-height:1.6;background:#0a0616;border:1px solid var(--panel-edge);border-radius:8px;padding:12px 15px}
  summary{cursor:pointer;color:var(--ink);font-weight:600}
  details ul{padding-left:18px;margin:8px 0 0}
  footer{font-size:11px;color:var(--muted);letter-spacing:.06em}
  @media (prefers-reduced-motion: reduce){ .pad,.toggle span::after{transition:none} .pad.lit{transform:none} }
`,
    html: `<div class="wrap">
  <header>
    <h1>NEÓN<br>CUADRANTE</h1>
    <p class="tag">// repetí la secuencia de luz</p>
  </header>

  <div class="device locked" id="device" data-level="4">
    <div class="gridpads" id="gridpads"></div>
    <div class="hub" aria-hidden="true">
      <div class="lcd" id="lcd">--</div>
      <small>ronda</small>
    </div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">Presioná «Iniciar» para empezar</div>

  <div class="controls">
    <button class="btn" id="start">Iniciar</button>
    <div class="seg" role="group" aria-label="Modo de juego" id="mode">
      <button data-m="goal" aria-pressed="true">Meta</button>

function init_neon(signal) {
  let pads = [];
  const gridpads = document.getElementById('gridpads');
  const device = document.getElementById('device');
  const lcd = document.getElementById('lcd');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const strictEl = document.getElementById('strict');
  const reverseEl = document.getElementById('reverse');
  const muteEl = document.getElementById('mute');
  const audioOnlyEl = document.getElementById('audioonly');
  muteEl.addEventListener('change', () => { if(muteEl.checked && audioOnlyEl.checked) audioOnlyEl.checked = false; });
  audioOnlyEl.addEventListener('change', () => { if(audioOnlyEl.checked && muteEl.checked) muteEl.checked = false; });
  const bestEl = document.getElementById('best');
  const goalV = document.getElementById('goalv');
  const goalBtns = [...document.querySelectorAll('#goal button')];
  const modeBtns = [...document.querySelectorAll('#mode button')];
  const timeBtns = [...document.querySelectorAll('#timeseg button')];
  const timeSegEl = document.getElementById('timeseg');
  const goalSegEl = document.getElementById('goal');
  const goalLabel = document.getElementById('goallabel');
  const levelBtns = [...document.querySelectorAll('#level button')];

  const FREQS = [415.3, 310, 252, 209, 554.4, 466.2, 349.2, 622.3];
  const KEYS = {q:0,w:1,a:2,s:3,'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7};
  const LABELS = ['Verde','Magenta','Amarillo','Cian','Naranja','Violeta','Rojo','Verde agua'];
  const KEYHINT = ['Q','W','A','S','5','6','7','8'];

  let ctx = null, seq = [], step = 0, accepting = false, running = false, goal = 14, token = 0;
  let mode = 'goal', timeLimit = 60, timeLeft = 0, timerInterval = null, peak = 0;
  let numColors = 4;
  let best = 0;
  try { best = +localStorage.getItem('neon-cuadrante-best') || 0; } catch(e){}
  bestEl.textContent = best;

  function buildPads(){
    gridpads.innerHTML = '';
    for(let i=0;i<numColors;i++){
      const b = document.createElement('button');
      b.className = 'pad'; b.dataset.i = i; b.setAttribute('aria-label', LABELS[i]);
      b.innerHTML = `<span class="key">${KEYHINT[i]}</span>`;
      gridpads.appendChild(b);
    }
    pads = [...gridpads.querySelectorAll('.pad')];
    pads.forEach(p => p.addEventListener('pointerdown', e => { e.preventDefault(); press(+p.dataset.i); }));
    pads.forEach(p => p.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); press(+p.dataset.i); } }));
  }
  buildPads();
  levelBtns.forEach(b => b.addEventListener('click', () => {
    if(running) return;
    levelBtns.forEach(x => x.setAttribute('aria-pressed', x===b ? 'true' : 'false'));
    numColors = +b.dataset.n;
    device.dataset.level = numColors;
    buildPads();
  }));

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function audio(){
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, ms, type='square', vol=.16){
    if(muteEl.checked) return;
    const a = audio(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.setValueAtTime(vol, t + ms/1000 - .03);
    g.gain.linearRampToValueAtTime(0, t + ms/1000);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + ms/1000 + .02);
  }

  async function flash(i, ms, visual=true){
    if(visual) pads[i].classList.add('lit');
    tone(FREQS[i], ms);
    await sleep(ms);
    if(visual) pads[i].classList.remove('lit');
  }

  function tempo(){
    const n = seq.length;
    if(n <= 5) return {on:420, gap:80};
    if(n <= 9) return {on:320, gap:70};
    if(n <= 13) return {on:240, gap:60};
    return {on:180, gap:50};
  }

  function lock(v){ accepting = !v; device.classList.toggle('locked', v); }
  function show(n, bad=false){ lcd.textContent = String(n).padStart(2,'0'); lcd.classList.toggle('bad', bad); }

  async function playSeq(){
    const my = token;
    lock(true);
    statusEl.textContent = 'Mirá la secuencia…';
    await sleep(600);
    const {on, gap} = tempo();
    for(const i of seq){
      if(my !== token) return;
      await flash(i, on, !audioOnlyEl.checked); await sleep(gap);
    }
    if(my !== token) return;
    step = 0; lock(false);
    statusEl.textContent = reverseEl.checked ? 'Tu turno (al revés)' : 'Tu turno';
  }

  async function nextRound(){
    seq.push(Math.floor(Math.random()*numColors));
    show(seq.length);
    await playSeq();
  }

  async function start(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    audio();
    token++; running = true; seq = []; peak = 0;
    startBtn.textContent = 'Reiniciar';
    if(mode === 'time'){
      timeLeft = timeLimit;
      goalV.textContent = timeLeft + 's';
      timerInterval = setInterval(tick, 1000);
    }
    await nextRound();
  }

  async function fail(){
    const my = token;
    lock(true);
    tone(90, 700, 'sawtooth', .14);
    lcd.textContent = '!!'; lcd.classList.add('bad');
    if(strictEl.checked){
      statusEl.textContent = `Error. Llegaste a ${seq.length - 1} ${seq.length-1===1?'ronda':'rondas'}. Volvés a empezar.`;
      await sleep(1400); if(my !== token) return;
      seq = []; await nextRound();
    } else {
      statusEl.textContent = 'Error. Mirá de nuevo.';
      await sleep(1100); if(my !== token) return;
      show(seq.length); await playSeq();
    }
  }

  async function win(){
    const my = token;
    lock(true); running = false;
    statusEl.textContent = `¡Ganaste! ${goal} rondas perfectas.`;
    const order = Array.from({length:numColors}, (_,k)=>k);
    for(let k=0;k<3;k++){
      for(const i of order){ if(my!==token) return; await flash(i, 90); }
    }
    startBtn.textContent = 'Jugar otra vez';
  }

  function tick(){
    if(!running){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } return; }
    timeLeft -= 1;
    if(timeLeft <= 0){
      timeLeft = 0; goalV.textContent = '0s';
      clearInterval(timerInterval); timerInterval = null;
      timeUp();
    } else {
      goalV.textContent = timeLeft + 's';
    }
  }

  function timeUp(){
    running = false; accepting = false; token++; lock(true);
    tone(90, 700, 'sawtooth', .16);
    statusEl.textContent = `¡Se acabó el tiempo! Llegaste a ${peak} ${peak===1?"ronda":"rondas"}.`;
    startBtn.textContent = 'Jugar otra vez';
  }

  async function press(i){
    if(!accepting || !running) return;
    const my = token;
    const idx = reverseEl.checked ? (seq.length - 1 - step) : step;
    if(i !== seq[idx]){ pads[i].classList.add('lit'); setTimeout(()=>pads[i].classList.remove('lit'),150); return fail(); }
    accepting = false;
    await flash(i, 220);
    if(my !== token) return;
    accepting = true;
    step++;
    if(step === seq.length){
      lock(true);
      const done = seq.length;
      if(done > best){ best = done; bestEl.textContent = best; try{ localStorage.setItem('neon-cuadrante-best', best); }catch(e){} }
      if(done > peak) peak = done;
      if(mode === 'goal' && done >= goal) return win();
      statusEl.textContent = '¡Bien!';
      await sleep(500); if(my !== token) return;
      nextRound();
    }
  }

  document.addEventListener('keydown', e => {
    if(e.target.closest && e.target.closest('.pad')) return;
    const k = KEYS[e.key.toLowerCase()];
    if(k !== undefined) press(k);
  }, {signal});
  startBtn.addEventListener('click', start);
  goalBtns.forEach(b => b.addEventListener('click', () => {
    goalBtns.forEach(x => x.setAttribute('aria-pressed', x===b ? 'true' : 'false'));
    goal = +b.dataset.g; if(mode === 'goal') goalV.textContent = goal;
  }));
  modeBtns.forEach(b => b.addEventListener('click', () => {
    modeBtns.forEach(x => x.setAttribute('aria-pressed', x===b ? 'true' : 'false'));
    mode = b.dataset.m;
    goalSegEl.hidden = mode !== 'goal';
    timeSegEl.hidden = mode !== 'time';
    if(goalLabel) goalLabel.textContent = mode === 'time' ? 'Tiempo' : 'Meta';
    goalV.textContent = mode === 'time' ? timeLimit + 's' : goal;
  }));
  timeBtns.forEach(b => b.addEventListener('click', () => {
    timeBtns.forEach(x => x.setAttribute('aria-pressed', x===b ? 'true' : 'false'));
    timeLimit = +b.dataset.t;
    if(mode === 'time') goalV.textContent = timeLimit + 's';
  }));
}

function init_consola(signal) {
  let pads = [];
  const padsEl = document.getElementById('pads');
  const brandEl = document.getElementById('brand');
  const device = document.getElementById('device');
  const lcd = document.getElementById('lcd');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const strictEl = document.getElementById('strict');
  const reverseEl = document.getElementById('reverse');
  const muteEl = document.getElementById('mute');

  document.getElementById('cardList').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if(card) mountSkin(card.dataset.skin);
  });
  document.getElementById('backBtn').addEventListener('click', showMenu);

  refreshCards();
})();
</script>

<div class="install" id="install" hidden></div>
<script>
// ---- PWA: service worker + instalación ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
(() => {
  const bar = document.getElementById('install');
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(8,8,12,.92);backdrop-filter:blur(6px);color:#f2f2f7;font:14px "Manrope",sans-serif;border-top:1px solid rgba(255,255,255,.12)';
  let deferred = null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let dismissed = false;
  try { dismissed = localStorage.getItem('memorion-install-off') === '1'; } catch(e){}
  if (standalone || dismissed) return;

  bar.innerHTML = '<span id="installMsg">Instalá Memorión para jugar sin conexión</span>' +
    '<button id="installBtn" style="appearance:none;border:0;cursor:pointer;font:700 13px \'Manrope\',sans-serif;padding:9px 16px;border-radius:999px;background:#6d8bff;color:#0a0a12">Instalar</button>' +
    '<button id="installClose" aria-label="Cerrar" style="appearance:none;border:0;background:transparent;color:#b8bcca;font:600 13px \'Manrope\',sans-serif;cursor:pointer;padding:8px">Ahora no</button>';
  const msg = document.getElementById('installMsg');
  const btn = document.getElementById('installBtn');
  const close = document.getElementById('installClose');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e; bar.hidden = false;
  });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null; bar.hidden = true;
  });
  close.addEventListener('click', () => {
    bar.hidden = true;
    try { localStorage.setItem('memorion-install-off','1'); } catch(e){}
  });
  window.addEventListener('appinstalled', () => { bar.hidden = true; });

  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (ios) {
    msg.textContent = 'Para instalar: tocá Compartir y después «Agregar a inicio»';
    btn.hidden = true; bar.hidden = false;
  }
})();
</script>
</body>
